name: E2E

# Runs this action (uses: ./) against the real Specwise API through RapidAPI: one diff and one validate request.
# Needs the repository secret RAPIDAPI_KEY; without it the job is skipped.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 1 * *"   # monthly: 2 requests, so it fits the free Basic plan (15 a month)

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.RAPIDAPI_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::RAPIDAPI_KEY is not set; skipping the end-to-end test."
      - name: Two local commits, base and revision of the fixture spec
        if: env.HAS_KEY == 'true'
        id: commits
        run: |
          git config user.name e2e && git config user.email e2e@localhost
          mkdir -p e2e && cp tests/fixtures/base.yaml e2e/openapi.yaml
          git add e2e && git commit -qm base && echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp tests/fixtures/revision.yaml e2e/openapi.yaml && git commit -qam revision
      - name: Check the spec with the action
        if: env.HAS_KEY == 'true'
        id: check
        continue-on-error: true   # the fixture revision has breaking changes on purpose
        uses: ./
        with:
          rapidapi-key: ${{ secrets.RAPIDAPI_KEY }}
          spec-paths: e2e/openapi.yaml
          base-ref: ${{ steps.commits.outputs.base }}
          validate: "true"
          comment: "false"
          max-requests: "2"
      - name: Check the outputs
        if: env.HAS_KEY == 'true'
        env:
          PASSED: ${{ steps.check.outputs.passed }}
          BREAKING: ${{ steps.check.outputs.breaking-changes }}
          SEMVER: ${{ steps.check.outputs.semver }}
          REQUESTS: ${{ steps.check.outputs.requests-used }}
          QUOTA: ${{ steps.check.outputs.quota-remaining }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "passed=$PASSED breaking=$BREAKING semver=$SEMVER requests=$REQUESTS quota=$QUOTA outcome=$OUTCOME"
          test "$OUTCOME" = failure    # the breaking changes must fail the step
          test "$PASSED" = false
          test "$BREAKING" = 3
          test "$SEMVER" = major
          test "$REQUESTS" = 2
          test -n "$QUOTA"             # RapidAPI's quota header came through
